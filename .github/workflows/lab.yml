name: PostgreSQL 18 synthetic reader (manual only)
on:
  workflow_dispatch:
    inputs:
      free_quota_confirmed:
        description: Standard public Linux runner verified free; applicable quota below 90 percent
        required: true
        default: false
        type: boolean
      expected_sha:
        description: Exact reviewed 40-character commit SHA
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: percona-postgres-manual-lab
  cancel-in-progress: false
jobs:
  lab:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'stpblgm-crypto/percona-postgres-testing-lab' && github.repository_id == '1408870785' && github.event.repository.private == false && inputs.free_quota_confirmed == true
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      EXPECTED_SHA: ${{ inputs.expected_sha }}
      TZ: UTC
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONOPTIMIZE: '0'
    steps:
      - name: Checkout exact reviewed SHA
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify exact source and environment
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_SHA" ]]
          sha256sum -c SHA256SUMS
          command -v docker
          docker info >/dev/null
          mkdir evidence
          {
            date -u +%FT%TZ
            git rev-parse HEAD
            git rev-parse HEAD^{tree}
            python3 --version
            cat /etc/os-release
            uname -srm
            docker version --format '{{.Server.Version}}'
          } > evidence/environment.txt
      - name: Test gate, validation, export and OCI lock offline
        shell: bash
        run: |
          set -euo pipefail
          python3 lab/test_gate.py
          python3 lab/test_validation.py
          python3 tests/test_reader_export.py
          python3 tests/test_image_lock.py
      - name: Full PG18 Docker reader entry point
        shell: bash
        run: |
          set -euo pipefail
          bash run_docker.sh 2>&1 | tee "$GITHUB_WORKSPACE/evidence/reader-wrapper.log"
      - name: Independently verify exported raw receipts
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          LOG="$GITHUB_WORKSPACE/evidence/reader-wrapper.log"
          test -f "$LOG"
          OUT=$(awk '/^Evidence: / { print substr($0, 11); exit }' "$LOG")
          [[ "$OUT" =~ ^/tmp/percona-reader\.[A-Za-z0-9]{8}/out$ ]]
          test -d "$OUT"
          mkdir "$GITHUB_WORKSPACE/evidence/reader-wrapper"
          cp -R "$OUT/." "$GITHUB_WORKSPACE/evidence/reader-wrapper/"
          test -f "$OUT/result.json"
          test -f "$OUT/oci-lock-check.json"
          test -f "$OUT/image-ids.txt"
          python3 lab/verify_receipts.py no-db "$OUT"
          python3 lab/verify_receipts.py db "$OUT/db"
          grep -Fx 'cleanup=PASS' "$OUT/db/cleanup-status.log"
          test "$(find "$OUT" -type f -perm -0002 | wc -l)" -eq 0
      - name: Bound raw evidence upload to 1 MiB
        if: always()
        id: evidence_size
        shell: bash
        run: |
          set -euo pipefail
          test -d evidence
          BYTES=$(du -sb evidence | cut -f1)
          [[ "$BYTES" -le 1048576 ]]
      - name: Retain synthetic evidence for one day
        if: always() && steps.evidence_size.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: synthetic-postgres-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: error
          retention-days: 1
